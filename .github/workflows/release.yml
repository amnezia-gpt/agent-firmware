name: release

# A pushed tag v* publishes the release: the installation script, the
# linux/amd64 binary and the workload release file. The enrollment page of the
# authorization server points at releases/latest/download/agent-firmware-install.sh,
# so nothing outside this repository changes for a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          CGO_ENABLED=0 go test ./...
      - name: Verify the published workload manifest and build assets
        env:
          WORKLOAD_MANIFEST_URL: ${{ vars.WORKLOAD_MANIFEST_URL }}
        run: |
          : "${WORKLOAD_MANIFEST_URL:?set the published workload manifest asset URL}"
          manifest=$(mktemp)
          trap 'rm -f "$manifest"' EXIT
          curl --fail --silent --show-error --location --max-redirs 3 \
            --proto '=https' --proto-redir '=https' --max-time 30 --max-filesize 65536 \
            --output "$manifest" "$WORKLOAD_MANIFEST_URL"
          WORKLOAD_PUBLISHED_MANIFEST="$manifest" sh scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/agent-firmware-install.sh dist/agent-firmware-linux-amd64 dist/workload-release.json --verify-tag --generate-notes
