name: release

# A pushed tag v* publishes the host binaries, the common installer and the
# pinned workload manifest.
on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          CGO_ENABLED=0 go test ./...
      - name: Check bootstrap
        if: runner.os == 'Linux'
        run: >-
          docker run --rm --network none --tmpfs /run:rw,noexec,nosuid
          --mount "type=bind,src=$PWD,dst=/work,readonly" ubuntu:24.04
          sh -ec 'touch /run/agent-firmware-installer-test && sh /work/tests/agent-firmware-install.sh'
      - name: Verify native macOS executable
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/agent-firmware" ./cmd/agent-firmware
          codesign --verify "$RUNNER_TEMP/agent-firmware"
          "$RUNNER_TEMP/agent-firmware" --help >/dev/null
  release:
    if: github.ref_type == 'tag'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The pinned workload release is not compared with the published one here:
      # the workloads repository is not public, so this job cannot download it.
      # Whoever replaces release/workload-release.json compares it by hand with
      # WORKLOAD_PUBLISHED_MANIFEST set for scripts/build-release.sh.
      - name: Build assets
        run: sh scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/agent-firmware-install.sh
          dist/agent-firmware-linux-amd64 dist/agent-firmware-linux-arm64 dist/workload-release.json
          dist/agent-firmware-darwin-arm64
          --verify-tag --generate-notes
